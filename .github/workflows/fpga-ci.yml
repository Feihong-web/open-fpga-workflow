name: FPGA CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build reproducible tool container
        run: docker build -t open-fpga-workflow:ci .

      - name: Run complete FPGA workflow
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            open-fpga-workflow:ci \
            make all

      - name: Upload reports and bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ice40-build
          path: |
            build/top.bin
            build/top.asc
            build/top.json
            build/timing.rpt
            build/wave.vcd
